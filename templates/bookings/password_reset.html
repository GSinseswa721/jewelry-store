{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Forgot Your Password?</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        {% if form.email.errors %}
        <div class="text-red-600">{{ form.email.errors }}</div>
        {% endif %}
        <button type="submit" class="w-full py-2 px-4 mt-4 rounded bg-rose-600 text-white font-semibold">Send Reset Link</button>
    </form>
</div>
{% endblock %}
